name: 본인 활동 기록 수정
description: 기존 활동 한 건을 지정하고 수정 후 전체 정보를 작성합니다.
title: "[활동 수정] "
labels: [ archive-update ]
body:
  - type: markdown
    attributes:
      value: |
        본인의 기존 활동 기록 한 건을 수정하는 폼입니다. 제출하면 자동으로 PR이 생성되고 운영진이 요청 내용과 활동 사실을 확인한 뒤 직접 머지합니다.
        먼저 아카이브나 데이터 파일에 적힌 기존 기록을 지정한 다음, 수정 후 전체 정보를 작성해주세요. 바꾸지 않는 항목도 함께 적어야 합니다.
        입력한 정보는 공개 이슈와 PR에 남으며, 수정 후 정보는 사이트에 공개됩니다. 수정 내용 설명과 증빙은 검토용으로만 사용합니다.
  - type: markdown
    attributes:
      value: |
        ## 수정할 기존 기록
        현재 기록에 적힌 GitHub 링크·모임명·활동 연도·역할을 그대로 입력해주세요. 아래 네 항목은 대상을 찾는 용도입니다.
  - type: input
    id: existing-github-url
    attributes:
      label: 기존 GitHub 링크
      description: 수정할 기존 기록에 연결된 GitHub 프로필 링크를 그대로 적어주세요.
      placeholder: https://github.com/your-account
    validations:
      required: true
  - type: input
    id: existing-community
    attributes:
      label: 기존 모임명
      description: 수정할 기존 기록에 적힌 동아리·모임명입니다.
      placeholder: 그리디
    validations:
      required: true
  - type: input
    id: existing-year
    attributes:
      label: 기존 활동 연도
      description: 수정할 기존 기록에 적힌 연도를 숫자로 적어주세요.
      placeholder: "2025"
    validations:
      required: true
  - type: dropdown
    id: existing-role
    attributes:
      label: 기존 역할
      description: 수정할 기존 기록에 적힌 역할입니다.
      options:
        - 초록스터디 리드
        - 초록스터디 리뷰어
        - 초록해듀오 멘토
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 수정 후 내용
        수정 후 사이트에 표시할 전체 정보를 입력해주세요. 바꾸지 않는 항목도 작성하고, 학교를 제거하려면 학교만 비워주세요.
  - type: input
    id: updated-name
    attributes:
      label: 수정 후 실명
      placeholder: 김초록
    validations:
      required: true
  - type: input
    id: updated-community
    attributes:
      label: 수정 후 모임명
      description: 기존 모임 표기를 사용해주세요. 초록해듀오 멘토는 초록해듀오로 적어주세요.
      placeholder: 그리디
    validations:
      required: true
  - type: input
    id: updated-university
    attributes:
      label: 수정 후 학교
      description: (선택) 기존 학교 표기를 사용해주세요(예시 세종대, 성균관대). 비워 제출하면 기존 학교 정보가 제거됩니다. 초록해듀오·연합 모임 등 학교가 없는 활동은 비워두세요.
      placeholder: 세종대
    validations:
      required: false
  - type: input
    id: updated-year
    attributes:
      label: 수정 후 활동 연도
      description: 수정 후 기록할 연도를 숫자로 적어주세요.
      placeholder: "2026"
    validations:
      required: true
  - type: dropdown
    id: updated-role
    attributes:
      label: 수정 후 역할
      options:
        - 초록스터디 리드
        - 초록스터디 리뷰어
        - 초록해듀오 멘토
    validations:
      required: true
  - type: input
    id: updated-github-url
    attributes:
      label: 수정 후 GitHub 링크
      description: 수정 후 기록에 연결할 GitHub 프로필 링크입니다. 변경하지 않는 경우 기존 링크를 다시 적어주세요.
      placeholder: https://github.com/your-account
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## 운영진 검토용"
  - type: textarea
    id: description
    attributes:
      label: 수정 내용 설명
      description: 어떤 내용을 왜 수정하는지 간단하게 설명해주세요. 사이트 데이터에는 넣지 않습니다.
      placeholder: 활동 연도가 잘못 적혀 있어 2025년에서 2026년으로 수정합니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 증빙 링크
      description: (선택) 리뷰한 PR, 활동 회고 등 활동을 확인할 수 있는 링크가 있으면 적어주세요. 사이트 데이터에는 넣지 않습니다. 적어주실 경우 운영진이 원활하게 활동 내용을 확인할 수 있습니다.
    validations:
      required: false
